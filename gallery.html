    const dialog=document.querySelector('.gallery-dialog'),dialogImage=document.querySelector('.dialog-image'),title=document.querySelector('#dialog-title'),meta=document.querySelector('#dialog-meta'),detail=document.querySelector('#dialog-detail'),caption=document.querySelector('#dialog-caption'),thumbnails=document.querySelector('#album-thumbnails'),slideStatus=document.querySelector('#slide-status'),slideshowToggle=document.querySelector('#slideshow-toggle'),setCover=document.querySelector('#set-cover'),coverStatus=document.querySelector('#cover-status');
    const coverStorageKey='zobayer-gallery-covers'; let savedCovers={},currentAlbumId='',currentImageIndex=0,slideTimer=null,isPlaying=false;
    try{savedCovers=JSON.parse(localStorage.getItem(coverStorageKey))||{};}catch(error){savedCovers={};}
    function updateAlbumCover(albumId,index){const image=albums[albumId].images[index],card=document.querySelector(`[data-album="${albumId}"]`),cardImage=card.querySelector('img');cardImage.src=image.src;cardImage.alt=image.alt;}
    Object.entries(savedCovers).forEach(([albumId,index])=>{if(albums[albumId]&&albums[albumId].images[index])updateAlbumCover(albumId,index);});
    function stopSlideshow(){if(slideTimer){clearInterval(slideTimer);slideTimer=null;}}
    function updateSlideshowControl(){const count=albums[currentAlbumId].images.length;slideStatus.textContent=`${currentImageIndex+1} / ${count}`;slideshowToggle.hidden=count<2;slideshowToggle.textContent=isPlaying?'Pause slideshow':'Resume slideshow';}
    function startSlideshow(){stopSlideshow();if(albums[currentAlbumId].images.length<2)return;isPlaying=true;updateSlideshowControl();slideTimer=setInterval(()=>selectImage((currentImageIndex+1)%albums[currentAlbumId].images.length,false),4500);}
    function selectImage(index,resetSlideshow=true){const image=albums[currentAlbumId].images[index];currentImageIndex=index;dialogImage.src=image.src;dialogImage.alt=image.alt;caption.textContent=image.caption;thumbnails.querySelectorAll('button').forEach((item,itemIndex)=>item.classList.toggle('is-selected',itemIndex===index));coverStatus.textContent='';updateSlideshowControl();if(resetSlideshow&&isPlaying)startSlideshow();}
    document.querySelectorAll('.album-card').forEach(card=>card.addEventListener('click',()=>{stopSlideshow();currentAlbumId=card.dataset.album;const album=albums[currentAlbumId];title.textContent=album.title;meta.textContent=album.meta;detail.textContent=album.detail;thumbnails.replaceChildren();album.images.forEach((image,index)=>{const button=document.createElement('button');button.type='button';button.className='album-thumbnail';button.setAttribute('aria-label',`View photograph ${index+1}: ${image.caption}`);const thumbnail=document.createElement('img');thumbnail.src=image.src;thumbnail.alt=image.alt;button.append(thumbnail);button.addEventListener('click',()=>selectImage(index));thumbnails.append(button);});currentImageIndex=Number.isInteger(savedCovers[currentAlbumId])?savedCovers[currentAlbumId]:0;isPlaying=album.images.length>1;selectImage(currentImageIndex,false);dialog.showModal();if(isPlaying)startSlideshow();}));
    slideshowToggle.addEventListener('click',()=>{if(isPlaying){isPlaying=false;stopSlideshow();updateSlideshowControl();}else startSlideshow();});
    setCover.addEventListener('click',()=>{savedCovers[currentAlbumId]=currentImageIndex;try{localStorage.setItem(coverStorageKey,JSON.stringify(savedCovers));coverStatus.textContent='This photo is now the album cover in this browser.';}catch(error){coverStatus.textContent='This browser cannot save the selected cover.';}updateAlbumCover(currentAlbumId,currentImageIndex);});
    document.querySelector('.dialog-close').addEventListener('click',()=>dialog.close());

    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
